<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sufii Store Marketplace</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fa;color:#17131d}header{background:#17121f;color:#fff;padding:14px 5%;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:900}.logo span{color:#b95cff}.search{flex:1;padding:12px 18px;border:0;border-radius:25px}.btn{border:0;border-radius:22px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#b95cff;color:#fff}.hero{padding:70px 7%;background:linear-gradient(135deg,#24102f,#8a38b7);color:#fff}.hero h1{font-size:clamp(38px,7vw,68px);margin:0 0 10px}.wrap{max-width:1200px;margin:auto;padding:40px 6%}.cats{display:flex;gap:10px;overflow:auto}.cat{background:#fff;border:1px solid #ddd;border-radius:22px;padding:10px 18px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0001}.pic{height:190px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:65px}.info{padding:16px}.price{font-size:21px;font-weight:800;margin:9px 0}.muted{color:#777;font-size:14px}.panel{background:#fff;border-radius:18px;padding:24px;margin-top:25px}footer{background:#17121f;color:#aaa;text-align:center;padding:35px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:20px}.modalbox{max-width:600px;margin:40px auto;background:#fff;border-radius:18px;padding:25px}.modalbox input,.modalbox select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}</style></head><body>
<header><div class="logo">🛍️ <span>Sufii</span> Store</div><input id="search" class="search" placeholder="Search products..." oninput="render()"><button class="btn primary" onclick="openSeller()">🏪 Sell on Sufii</button><button class="btn" onclick="openCart()">🛒 <span id="count">0</span></button></header>
<div class="hero"><h1>Shop Smart. Live Better.</h1><p>One marketplace for customers and independent sellers.</p><button class="btn primary" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now</button></div>
<div class="wrap"><div class="cats"><button class="cat" onclick="filter='All';render()">All</button><button class="cat" onclick="filter='Fashion';render()">Fashion</button><button class="cat" onclick="filter='Electronics';render()">Electronics</button><button class="cat" onclick="filter='Beauty';render()">Beauty</button><button class="cat" onclick="filter='Home';render()">Home</button></div><h2 id="products">Featured Products</h2><div id="grid" class="grid"></div><div class="panel"><h2>🏪 Create Your Store</h2><p class="muted">Apply to become a seller on Sufii Store.</p><button class="btn primary" onclick="openSeller()">Start Selling</button></div></div><footer>© 2026 Sufii Store Marketplace</footer>
<div id="seller" class="modal"><div class="modalbox"><button class="btn" style="float:right" onclick="closeM('seller')">✕</button><h2>🏪 Create Your Store</h2><input id="sellerName" placeholder="Your name"><input id="storeName" placeholder="Store name"><input id="sellerEmail" placeholder="Email"><select id="sellerCat"><option>Fashion</option><option>Electronics</option><option>Beauty</option><option>Home</option></select><button class="btn primary" onclick="applySeller()">Submit Application</button></div></div>
<div id="cart" class="modal"><div class="modalbox"><button class="btn" style="float:right" onclick="closeM('cart')">✕</button><h2>🛒 Cart</h2><div id="list"></div><h3 id="total"></h3></div></div>
<script>
const products=[['Wireless Headphones',2999,'Electronics','🎧','Sufii Official'],['Smart Watch',4499,'Electronics','⌚','Tech Hub'],['Premium T-Shirt',1499,'Fashion','👕','Style House'],['Travel Backpack',2199,'Fashion','🎒','Urban Bags'],['Beauty Kit',1899,'Beauty','💄','Glow Store'],['Home Lamp',1299,'Home','💡','Home World']].map(x=>({name:x[0],price:x[1],cat:x[2],icon:x[3],seller:x[4]}));let filter='All',cart=JSON.parse(localStorage.sufii_cart||'[]');
function render(){let q=search.value.toLowerCase();let a=products.filter(p=>(filter==='All'||p.cat===filter)&&p.name.toLowerCase().includes(q));grid.innerHTML=a.map(p=>`<div class="card"><div class="pic">${p.icon}</div><div class="info"><h3>${p.name}</h3><div class="muted">Sold by ${p.seller}</div><div class="price">PKR ${p.price.toLocaleString()}</div><button class="btn primary" onclick="add('${p.name}')">Add to Cart</button></div></div>`).join('');count.textContent=cart.length}
function add(n){cart.push(products.find(p=>p.name===n));localStorage.sufii_cart=JSON.stringify(cart);render();alert('Added to cart')}
function openSeller(){seller.style.display='block'}function openCart(){cartModal=document.getElementById('cart');cartModal.style.display='block';list.innerHTML=cart.length?cart.map(x=>`<p>${x.icon} ${x.name} — PKR ${x.price.toLocaleString()}</p>`).join(''):'Cart is empty';total.textContent='Total: PKR '+cart.reduce((s,x)=>s+x.price,0).toLocaleString()}function closeM(x){document.getElementById(x).style.display='none'}
function applySeller(){if(!storeName.value.trim())return alert('Store name required');localStorage.seller_application=JSON.stringify({name:sellerName.value,email:sellerEmail.value,store:storeName.value,category:sellerCat.value});alert('Application saved');closeM('seller')}render();
</script></body></html>
